<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Китайские карточки</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- Экран 1: список карточек -->
  <section id="view-list" class="view">
    <header class="page-head">
      <h1>Китайские карточки</h1>
      <div class="user-box">
        <label for="user-name">Ваше имя</label>
        <input id="user-name" type="text" placeholder="необязательно" autocomplete="off">
      </div>
    </header>

    <div class="controls">
      <label class="field">
        <span>Урок</span>
        <select id="filter-lesson"></select>
      </label>
      <label class="field">
        <span>Уровень</span>
        <select id="filter-level"></select>
      </label>
      <label class="field field-wide">
        <span>Поиск по названию</span>
        <input id="filter-search" type="search" placeholder="например: 你好" autocomplete="off">
      </label>
      <button id="filter-reset" class="btn btn-ghost" type="button">Сбросить</button>
    </div>

    <p id="list-status" class="status"></p>
    <div id="list-error" class="error hidden"></div>
    <ul id="card-list" class="card-list"></ul>
  </section>

  <!-- Экран 2: карточка -->
  <section id="view-card" class="view hidden">
    <div class="card-top">
      <button id="btn-back" class="btn btn-ghost" type="button">← Назад к списку</button>
    </div>

    <header class="card-head">
      <h2 id="card-title"></h2>
      <div id="card-meta" class="meta"></div>
    </header>

    <div id="card-error" class="error hidden"></div>
    <div id="card-preamble" class="preamble hidden"></div>
    <div id="card-sections" class="sections"></div>

    <div id="card-rating" class="rating hidden">
      <div class="rating-label">Насколько помню?</div>
      <div class="rating-buttons">
        <button class="btn rate rate-bad" type="button" data-rating="bad">Не помню</button>
        <button class="btn rate rate-ok" type="button" data-rating="ok">Помню нормально</button>
        <button class="btn rate rate-good" type="button" data-rating="good">Помню хорошо</button>
      </div>
      <p id="rating-info" class="rating-info"></p>
    </div>

    <nav class="card-nav">
      <button id="btn-prev" class="btn" type="button">← Предыдущая</button>
      <button id="btn-next" class="btn" type="button">Следующая →</button>
    </nav>
  </section>

  <footer class="foot">
    <a id="repo-link" href="#">Репозиторий на GitHub</a>
  </footer>
</div>

<script src="js/md.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
